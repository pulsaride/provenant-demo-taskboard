# Profile `legacydb` (guarantee tier: Isolated): the application over the FROZEN legacy database.
# Hibernate validates the mapping and changes nothing: no script runs, no object is created or altered.
# Start with --spring.profiles.active=legacydb and set PROVENANT_LEGACY_DB_URL, _USER and _PASSWORD.
spring.datasource.url=${PROVENANT_LEGACY_DB_URL}
spring.datasource.username=${PROVENANT_LEGACY_DB_USER}
spring.datasource.password=${PROVENANT_LEGACY_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.sql.init.mode=never
# Hibernate 6 creates the temporary tables of multi-table bulk operations at start-up by default: nothing is created here.
spring.jpa.properties.hibernate.query.mutation_strategy.global_temporary.create_tables=false
spring.jpa.properties.hibernate.query.mutation_strategy.global_temporary.drop_tables=false
spring.jpa.properties.hibernate.query.mutation_strategy.persistent.create_tables=false
spring.jpa.properties.hibernate.query.mutation_strategy.persistent.drop_tables=false
# org.hibernate.community.dialect.DerbyDialect is not in hibernate-core; the dialect jar is pinned in the lock.
spring.jpa.properties.hibernate.dialect=org.hibernate.community.dialect.DerbyDialect
