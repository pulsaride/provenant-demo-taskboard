# Profile `postgresql` (guarantee tier: Isolated): PostgreSQL over the emitted schema.
# Start with --spring.profiles.active=postgresql
# The script is not idempotent: set PROVENANT_PG_SCHEMA_INIT=never once the schema exists.
spring.datasource.url=${PROVENANT_PG_URL:jdbc:postgresql://localhost:5432/taskboard}
spring.datasource.username=${PROVENANT_PG_USER:postgres}
spring.datasource.password=${PROVENANT_PG_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=${PROVENANT_PG_SCHEMA_INIT:always}
spring.sql.init.schema-locations=classpath:db/schema-postgresql.sql
