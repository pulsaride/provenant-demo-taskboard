spring.application.name=taskboard
spring.datasource.url=jdbc:h2:mem:defaultPU;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.ddl-auto=create-drop
server.servlet.session.cookie.same-site=lax
# Explicit (RFC-033). Legacy provider EclipseLink: lazy associations load on detached entities.
# Request-scoped loading is kept for the REST controllers; loading outside a request is not carried.
spring.jpa.open-in-view=true
