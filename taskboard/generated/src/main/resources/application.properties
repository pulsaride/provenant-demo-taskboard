spring.application.name=taskboard
spring.datasource.url=jdbc:h2:mem:defaultPU;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.ddl-auto=create-drop
server.servlet.session.cookie.same-site=lax
# Id generation (RFC-040): the legacy EclipseLink SEQUENCE table, the row holds the last id of the block.
spring.jpa.properties.hibernate.id.generator.stored_last_used=true
spring.jpa.properties.hibernate.id.optimizer.pooled.preferred=pooled-lo
# Explicit (RFC-033). Legacy provider EclipseLink: lazy associations load on detached entities.
# Request-scoped loading is kept for the REST controllers.
spring.jpa.open-in-view=true
# Entities held across requests (view beans) load a lazy association on a private temporary session, as the EclipseLink value holder did.
# Hibernate runs a short resource-local transaction per load and returns read-only elements (RFC-033 §3, ruling docs/autopilot/rulings/2026-11-09-lazy-load-eclipselink.md).
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true
# Native queries return java.sql date and time values, as on Hibernate 6 (RFC-041 section 3.2 item 4).
spring.jpa.properties.hibernate.query.native.prefer_jdbc_datetime_types=true
# Framework settings of the target line, keeping the v1 behaviour (RFC-041 section 3.3 item 2).
spring.jackson.use-jackson2-defaults=true
